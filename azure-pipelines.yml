trigger:
- master

resources:
- repo: self

variables:
- group: public-nuget
- name: vmImageName
  value: 'ubuntu-latest'
- name: restore-projects
  value: '**/*.csproj'
- name: test-projects
  value: '**/*[Tt]ests/*.csproj'
- name: testResultsDirectory
  value: '$(Agent.TempDirectory)/TestResults'
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'
- name: envName
  value: 'brandup-mongodb'
- name: version-major
  value: "10"
- name: version-minor
  value: "0"

name: $(version-major).$(version-minor).$(rev:r)

pool:
  # vmImage: $(vmImageName)
  name: Test

stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: BuildNet
    displayName: Build
    pool:
      #vmImage: $(vmImageName)
      name: Test
      workspace:
        clean: all
    steps:
    - script: |
        echo "Hello, world!"
        echo "build number - $(Build.BuildNumber)"
      displayName: 'print variables'

    - checkout: self
      clean: "true"
      persistCredentials: "true"

    - task: UseDotNet@2
      displayName: 'use dotnet 10.x'
      inputs:
        packageType: 'sdk'
        version: '10.x'
        
    - task: DotNetCoreCLI@2
      displayName: 'dotnet restore'
      inputs:
        command: 'restore'
        projects: $(restore-projects)
        feedRestore: 'BrandUp'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet build'
      inputs:
        command: 'build'
        projects: $(restore-projects)
        arguments: --configuration $(buildConfiguration) /p:Version=$(Build.BuildNumber)

    # Tests run on Microsoft.Testing.Platform (see global.json), which writes its own
    # trx/cobertura reports, so publishTestResults must stay off to keep the task from
    # injecting VSTest options that the platform does not understand.
    - task: DotNetCoreCLI@2
      displayName: 'dotnet test'
      inputs:
        command: test
        projects: $(test-projects)
        arguments: >
          --configuration $(buildConfiguration)
          --results-directory $(testResultsDirectory)
          --report-trx
          --coverage
          --coverage-output-format cobertura
        failTaskOnFailedTests: true
        publishTestResults: false

    - task: PublishTestResults@2
      displayName: 'publish test results'
      condition: succeededOrFailed()
      inputs:
        testRunner: VSTest
        testResultsFiles: '$(testResultsDirectory)/**/*.trx'
        mergeTestResults: true
        testRunTitle: "solution tests"
        failTaskOnFailedTests: true

    # Only the top level: the same reports are duplicated under In/<machine>/, and a ** pattern would
    # count every file twice.
    - task: PublishCodeCoverageResults@2
      displayName: 'publish code coverage'
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(testResultsDirectory)/*.cobertura.xml'
        pathToSources: $(Build.SourcesDirectory)
        failIfCoverageEmpty: true

    - task: DotNetCoreCLI@2
      displayName: "dotnet pack"
      inputs:
        command: "custom"
        projects: "src/*/*.csproj"
        custom: "pack"
        arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) /p:Version=$(Build.BuildNumber)"

    - publish: $(build.artifactstagingdirectory)
      displayName: publish artifact
      condition: succeededOrFailed()
      artifact: net
      
  - job: GitTag
    displayName: Add git tag
    dependsOn: [ BuildNet ]
    condition: succeeded()
    steps:
    - checkout: self
      clean: "true"
      persistCredentials: "true"

    - powershell: |
          git config --global user.name "AzureDevOps Agent"
          git tag "$(Build.BuildNumber)" --force
          git push origin "$(Build.BuildNumber)" --force
          Write-Output "Tagging $(Build.Repository.Name) with $(Build.BuildNumber)"
      displayName:  set git tag

- stage: Production
  displayName: Deploy stage
  dependsOn: Build
  jobs:
  - deployment: Production
    condition: succeeded()
    displayName: Production
    pool:
      vmImage: $(vmImageName)
    environment: $(envName)
    strategy:
      runOnce:
        deploy:
          steps:
          
          - task: DotNetCoreCLI@2
            displayName: 'publish nuget'
            inputs:
              command: custom
              custom: nuget
              arguments: >
                push $(Pipeline.Workspace)/net/*.nupkg
                -s $(nuget-api-url)
                -k $(nuget-api-key)